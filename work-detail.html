<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">

    <title>作品詳細 | m!ntmoch! MotionPortfolio</title>
    <meta name="description" content="m!ntmoch!（友部佑征）の制作物の詳細ページ。">
    <meta name="theme-color" content="#ffffff">

    <meta property="og:type" content="article">
    <meta property="og:site_name" content="m!ntmoch! MotionPortfolio">
    <meta property="og:title" content="作品詳細 | m!ntmoch! MotionPortfolio">
    <meta property="og:image" content="https://mm-c2g.github.io/mintmochi_motionportfolio_ver1.0/assets/images/og-image.jpg">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- スクロール進捗バー（このサイトで唯一グラデーションを使う場所） -->
    <div class="scroll-progress" aria-hidden="true"><span id="scroll-progress-bar"></span></div>

    <!-- 一覧に戻るリンク -->
    <header class="site-header" id="site-header">
        <a href="index.html" class="back-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Index
        </a>
    </header>

    <!-- ここから下の中身は、すべて work-detail.js が works-data.js から流し込みます -->
    <main class="container detail-container">
        <!-- タイトルエリア -->
        <div class="detail-header">
            <div class="detail-header-main">
                <h1 id="detail-title">作品タイトル</h1>
                <p class="detail-role" id="detail-role"></p>
            </div>
            <span class="detail-code" id="detail-code"></span>
        </div>

        <!-- 受賞歴がある作品だけ表示 -->
        <p class="detail-award" id="detail-award" hidden></p>

        <!-- ============================================== -->
        <!-- 映像レイアウト (type: "video") -->
        <!-- ============================================== -->
        <div id="layout-video" hidden>
            <div class="youtube-wrapper dummy-bg">
                <iframe id="detail-youtube" src="" title="作品動画" loading="lazy" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen></iframe>
            </div>

            <div class="scenes-grid" id="scenes-grid">
                <!-- シーン画像が自動で入ります -->
            </div>
        </div>

        <!-- ============================================== -->
        <!-- 平面レイアウト (type: "graphic") -->
        <!-- ============================================== -->
        <div id="layout-graphic" hidden>
            <div class="graphic-wrapper dummy-bg">
                <img id="detail-graphic-img" src="" alt="">
            </div>
        </div>

        <!-- ============================================== -->
        <!-- 概要・ツール等（共通） -->
        <!-- ============================================== -->
        <div class="detail-info-box">
            <h2 class="detail-info-heading">Overview</h2>
            <div class="detail-info-body">
                <p class="detail-summary" id="detail-summary"></p>
                <p id="detail-description"></p>
                <div id="detail-site-url" hidden>
                    <a href="" target="_blank" rel="noopener noreferrer" class="detail-site-link">
                        <span>実際のサイトを見る</span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M7 17 17 7"></path>
                            <path d="M8 7h9v9"></path>
                        </svg>
                    </a>
                </div>
                <dl class="detail-meta">
                    <div><dt>担当</dt><dd id="detail-meta-role"></dd></div>
                    <div><dt>ツール</dt><dd id="detail-tools"></dd></div>
                    <div id="detail-period-row"><dt>制作時期</dt><dd id="detail-period"></dd></div>
                    <div><dt>制作期間</dt><dd id="detail-duration"></dd></div>
                </dl>
            </div>
        </div>

        <!-- 制作プロセスの画像ギャラリーがここに入ります -->

        <!-- 前後の作品へのリンク -->
        <nav class="detail-pager" id="detail-pager" aria-label="他の作品へ移動"></nav>
    </main>

    <footer class="site-footer">
        <div class="container">
            <span class="label">&copy; 2026 m!ntmoch!</span>
            <span class="label">MotionPortfolio</span>
        </div>
    </footer>

    <!-- データ → 共通処理 → このページ専用処理、の順で読み込む -->
    <script src="works-data.js"></script>
    <script src="script.js"></script>
    <script src="work-detail.js"></script>
</body>

</html>
